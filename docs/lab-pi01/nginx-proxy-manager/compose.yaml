# ============================================================
# Lab-Pi01 - Nginx Proxy Manager
#
# Purpose:
#   Deploys Nginx Proxy Manager to provide reverse proxy and
#   HTTPS services for the homelab.
#
# Documentation:
#   https://nginxproxymanager.com/
# ============================================================

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager

    ports:
      - "80:80"    # HTTP
      - "81:81"    # NPM Administration
      - "443:443"  # HTTPS

    volumes:
      # Application data
      - ./data:/data

      # SSL certificates
      - ./letsencrypt:/etc/letsencrypt

    restart: unless-stopped
