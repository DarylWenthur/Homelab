# ============================================================
# Lab-Pi01 - Pi-hole
#
# Purpose:
#   Deploys Pi-hole to provide internal DNS resolution and
#   network-wide ad blocking for the homelab.
#
# Documentation:
#   https://pi-hole.net/
# ============================================================

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole

    ports:
      - "53:53/tcp"   # DNS (TCP)
      - "53:53/udp"   # DNS (UDP)
      - "8080:80"     # Pi-hole Web Interface

    environment:
      TZ: America/Los_Angeles
      FTLCONF_webserver_api_password: ""
      FTLCONF_dns_listeningMode: "ALL"

    volumes:
      # Pi-hole persistent configuration
      - ./etc-pihole:/etc/pihole

    restart: unless-stopped
